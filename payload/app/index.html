<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trang chủ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="controls.css">
</head>
<body>
  <!-- Ambient glow layers: unused in this skin (kept for app.js element lookups). -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <!-- Top shelf name: unused in this skin (kept for app.js element lookups). -->
  <div id="hero"></div>

  <header>
    <div id="leftBlock">
      <div id="greeting"></div>
      <div id="date"></div>
      <div id="timeRow">
        <span id="clock"></span><span class="divider"></span>
      </div>
    </div>
    <section id="weather" aria-label="Thời tiết Cẩm Thủy, Thanh Hóa">
      <div id="weatherLocation">Cẩm Thủy, Thanh Hóa</div>
      <div class="weather-main">
        <span id="weatherCurrent">--°</span>
        <svg id="weatherIcon" viewBox="0 0 24 24" aria-hidden="true">
          <g class="weather-sun"><circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4m0-15.6-1.4 1.4M5.6 18.4l-1.4 1.4"/></g>
          <g class="weather-cloud"><path d="M6 18h11a4 4 0 0 0 0-8 6 6 0 0 0-11-1A4.5 4.5 0 0 0 6 18z"/></g>
          <g class="weather-rain"><path d="M6 15h11a4 4 0 0 0 0-8 6 6 0 0 0-11-1A4.5 4.5 0 0 0 6 15zM8 18l-1 2m6-2-1 2m6-2-1 2"/></g>
        </svg>
      </div>
      <div id="weatherCondition">—</div>
      <div id="weatherRange">↑—°　↓—°</div>
    </section>
    <div id="topButtons">
      <button class="system-button" id="btnInputs" type="button" aria-label="Nguồn vào TV" title="Nguồn vào TV" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2.2"/><path d="M8 21h8m-4-4v4M7 10h10m-3-3 3 3-3 3"/></svg>
      </button>
      <button class="system-button" id="btnWifi" style="display:none" aria-hidden="true" type="button" aria-label="Kết nối mạng" title="Kết nối mạng" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="wifi-mark"><path d="M1.6 7.7a16.3 16.3 0 0 1 20.8 0l-2.3 2.8a12.7 12.7 0 0 0-16.2 0Zm4 4.8a10 10 0 0 1 12.8 0L16 15.4a6.2 6.2 0 0 0-8 0Zm4 4.9a3.8 3.8 0 0 1 4.8 0L12 20.3Z"/></g><g class="ethernet-mark"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v3m3-3v3m4-3v3m3-3v3M8 19v2m8-2v2"/></g><g class="offline-mark"><path d="M3 9a14 14 0 0 1 18 0M5 5l14 14"/></g></svg>
      </button>
      <button class="system-button" id="btnAction" type="button" aria-label="Trung tâm điều khiển" title="Trung tâm điều khiển" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="6" rx="3"/><circle cx="7" cy="7" r="2" fill="currentColor" stroke="none"/><rect x="2" y="14" width="20" height="6" rx="3"/><circle cx="17" cy="17" r="2" fill="currentColor" stroke="none"/></svg></button>
      <button class="system-button" id="btnSettings" type="button" aria-label="Cài đặt TV" title="Cài đặt TV" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor"><path d="m10 2-.5 2.2-2.1.9-2-.9-2 3.5 1.7 1.5L5 12l-1.9 1.5 2 3.5 2.2-.6 2 1.2.7 2.4h4l.7-2.4 2-1.2 2.2.6 2-3.5L19 12l-.1-2.8 1.7-1.5-2-3.5-2 .9-2.1-.9L14 2Z"/><circle cx="12" cy="11" r="4"/></g></svg>
      </button>
    </div>
  </header>

  <!-- The single dock row: tiles and the glass highlight, scrolling sideways. -->
  <div id="viewport">
    <div id="dockBand" aria-hidden="true"></div>
    <div id="stage">
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- Menu nguồn vào. -->
  <div id="inputsPanel" class="hidden"></div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="lunar-calendar.js"></script>
  <script src="tv-shortcut-order.js"></script>
  <script src="lgws-order.js"></script>
  <script src="app.js"></script>
  <script src="control-token.js"></script>
  <script src="controls.js"></script>
</body>
</html>
